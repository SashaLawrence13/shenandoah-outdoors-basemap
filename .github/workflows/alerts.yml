name: Park and forest alerts and park data

# Every 3 hours: fetch Shenandoah NP / Blue Ridge Parkway / A.T. alerts from
# the NPS API (key in the NPS_API_KEY secret) and the George Washington &
# Jefferson NF alerts page, and publish alerts/alerts.json on Pages for the
# Mossback app. Commits only when something changed.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (without file contents) so the daily check can see
          # when alerts.json last changed; sparse so the tiles aren't checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts
            alerts
            park
            conditions
            ridb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch alerts
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: python3 scripts/fetch_alerts.py
      - name: Fetch Blue Ridge Parkway closures (NPS page, no key)
        continue-on-error: true
        run: python3 scripts/fetch_blri_closures.py
      - name: Fetch Monongahela NF alerts (Forest Service page, no key)
        continue-on-error: true
        run: python3 scripts/fetch_alerts_monongahela.py
      - name: Fetch park details (webcams, events, campgrounds, visitor centers)
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
          WINDY_WEBCAMS_KEY: ${{ secrets.WINDY_WEBCAMS_KEY }}
        run: python3 scripts/fetch_park.py
      - name: Fetch conditions (fires, air quality, recent birds; per-region files from scripts/conditions_regions.json)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
          VDOT_TOKEN: ${{ secrets.VDOT_TOKEN }}
          VDOT_INCIDENTS_TOKEN: ${{ secrets.VDOT_INCIDENTS_TOKEN }}
          VDOT_EVENTS_TOKEN: ${{ secrets.VDOT_EVENTS_TOKEN }}
          VDOT_ROAD_CONDITION_TOKEN: ${{ secrets.VDOT_ROAD_CONDITION_TOKEN }}
          VDOT_WEATHER_SHORT_TOKEN: ${{ secrets.VDOT_WEATHER_SHORT_TOKEN }}
          VDOT_WEATHER_LONG_TOKEN: ${{ secrets.VDOT_WEATHER_LONG_TOKEN }}
          TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}
        run: python3 scripts/fetch_conditions.py
      - name: Fetch Recreation.gov facilities (forest campgrounds)
        env:
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
        run: python3 scripts/fetch_ridb.py
      - name: Publish if changed (or once a day, so "checked" stays fresh)
        run: |
          publish=$(python3 - <<'PY'
          import glob, json, os, subprocess, time
          def strip(d):
              d = {k: v for k, v in d.items() if k != "fetchedAt"}
              for w in d.get("webcams", []):
                  w.pop("updated", None)
              return d
          changed = False
          # conditions/regions/<id>.json: one small file per region (air and birds), written by fetch_conditions.py.
          for path in ("alerts/alerts.json", "alerts/blri-closures.json", "alerts/monongahela-alerts.json", "park/park.json", "conditions/conditions.json", "ridb/ridb.json") + tuple(sorted(glob.glob("conditions/regions/*.json"))):
              if not os.path.exists(path):
                  continue
              new = json.load(open(path))
              try:
                  old = json.loads(subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True, text=True).stdout)
              except ValueError:
                  changed = True
                  continue
              changed = changed or strip(old) != strip(new)
          last = int(subprocess.run(["git", "log", "-1", "--format=%ct", "--", "alerts", "park", "conditions", "ridb"],
                                    capture_output=True, text=True).stdout.strip() or 0)
          print("yes" if changed or time.time() - last > 86400 else "no")
          PY
          )
          if [ "$publish" != "yes" ]; then git checkout -- alerts park conditions ridb 2>/dev/null || true; exit 0; fi
          git config user.name "Mossback alerts bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The generated files are always this run's and are never merged: if another push (contours, scripts,
          # an overlapping run) landed meanwhile, start again from the new tip and put this run's files on top.
          # (A rebase of the old commit onto a new bot commit conflicted in the generated JSON, 2026-10-07.)
          gen=$(mktemp -d)
          for dir in alerts park conditions ridb; do cp -R "$dir" "$gen/"; done
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            for dir in alerts park conditions ridb; do mkdir -p "$dir" && cp -R "$gen/$dir/." "$dir/"; done
            git add alerts park conditions ridb
            if git diff --cached --quiet; then echo "already published by another run"; exit 0; fi
            git commit -q -m "Alerts, park data and conditions: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
