name: Park and forest alerts and park data

# Every 3 hours: fetch Shenandoah NP / Blue Ridge Parkway / A.T. alerts from
# the NPS API (key in the NPS_API_KEY secret) and the George Washington &
# Jefferson NF alerts page, and publish alerts/alerts.json on Pages for the
# Mossback app. Commits only when something changed.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (without file contents) so the daily check can see
          # when alerts.json last changed; sparse so the tiles aren't checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts
            alerts
            park
            conditions
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch alerts
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: python3 scripts/fetch_alerts.py
      - name: Fetch park details (webcams, events, campgrounds, visitor centers)
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: python3 scripts/fetch_park.py
      - name: Fetch conditions (fires, air quality, recent birds)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
          VDOT_TOKEN: ${{ secrets.VDOT_TOKEN }}
        run: python3 scripts/fetch_conditions.py
      - name: Publish if changed (or once a day, so "checked" stays fresh)
        run: |
          publish=$(python3 - <<'PY'
          import json, subprocess, time
          def strip(d):
              d = {k: v for k, v in d.items() if k != "fetchedAt"}
              for w in d.get("webcams", []):
                  w.pop("updated", None)
              return d
          changed = False
          for path in ("alerts/alerts.json", "park/park.json", "conditions/conditions.json"):
              new = json.load(open(path))
              try:
                  old = json.loads(subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True, text=True).stdout)
              except ValueError:
                  changed = True
                  continue
              changed = changed or strip(old) != strip(new)
          last = int(subprocess.run(["git", "log", "-1", "--format=%ct", "--", "alerts", "park", "conditions"],
                                    capture_output=True, text=True).stdout.strip() or 0)
          print("yes" if changed or time.time() - last > 86400 else "no")
          PY
          )
          if [ "$publish" != "yes" ]; then git checkout -- alerts park conditions 2>/dev/null || true; exit 0; fi
          git config user.name "Mossback alerts bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts/alerts.json park/park.json conditions/conditions.json
          git commit -m "Alerts, park data and conditions: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
